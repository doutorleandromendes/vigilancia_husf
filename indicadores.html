  var stRef=useState({sel:defPt,pop:null});
  var st=stRef[0],setSt=stRef[1];
  var selPt=st.sel,openPop=st.pop;

  function selBar(p){setSt(function(s){return{sel:p,pop:null};});}

  var sm=sahe&&sahe.meses&&selPt?sahe.meses[selPt]:null;
  var zona=sm?sm.zona:null;
  var ZS={
    epidemica:{bg:'#ffebee',c:'#c62828',b:'#c6282833',l:'epidêmica'},
    alerta:   {bg:'#fff8e1',c:'#e65100',b:'#e6510033',l:'alerta'},
    endemica: {bg:'#e8f5e9',c:'#2e7d32',b:'#2e7d3233',l:'endêmica'},
    baixa:    {bg:'#e8f5e9',c:'#2e7d32',b:'#2e7d3233',l:'zona baixa'},

        letterSpacing:.5,padding:'2px 7px',borderRadius:4,
        border:'1px solid '+GREEN+'44',whiteSpace:'nowrap'}},badge):null;

  var mkEl=null;

      marginLeft:4,background:up?'#ffebee':'#e8f5e9',

      up?'↑ tendência crescente':'↓ tendência decrescente');

  var currColor=CURR;
  if(zona==='epidemica')currColor='#c62828';
  else if(zona==='alerta')currColor='#e65100';

  function Pop(key,isRight){
    var txt=null;
    if(key==='pct'&&sm){var z=sm.zona||'endemica';txt=SAHE_TXT.pct[z]||SAHE_TXT.pct.endemica;}
    if(key==='poi'&&sm){txt=sm.p_poi!=null&&sm.p_poi<0.05?SAHE_TXT.poi.sig:SAHE_TXT.poi.ns;}
    if(key==='mk'&&sahe){
      var dir=sahe.mk_p!=null&&sahe.mk_p<0.05?(sahe.mk_dir>0?'up':'dn'):'ns';
      txt=SAHE_TXT.mk[dir];

    if(!txt)return null;
    var cls='sahe-pop'+(openPop===key?' open':'')+(isRight?' right':'');
    return h('div',{className:cls,style:{pointerEvents:'none'}},
      h('div',{className:'sp-title'},
        key==='pct'?'Posição histórica':key==='poi'?'A variação foi por acaso?':'A situação está melhorando ou piorando?'),
      h('div',{className:'sp-body'},txt.b),
      h('div',{className:'sp-tip'},txt.t)
    );
  }

  var stripEl=null;
  if(sahe){
    function fmtP(v){if(v==null)return'—';if(v<0.001)return'<0,001';return String(v).replace('.',',');}
    var sig=sm&&sm.p_poi!=null&&sm.p_poi<0.05;
    var mkSig=sahe.mk_p!=null&&sahe.mk_p<0.05;
    var mkDir=sahe.mk_dir>0?'+':'';
    var sigC='#c62828',okC='#1b5e20',neuC='#1a2744';
    var pctC=zona==='epidemica'?sigC:zona==='alerta'?'#b85000':okC;

    function Cell3(label,popKey,val,sub,vc,isRight){
      return h('div',{style:{padding:'8px 11px 9px',position:'relative',
          flex:1,borderRight:isRight?'none':'1px solid #f0f2f5',cursor:'default'},
          onMouseLeave:function(){setSt(function(s){return{sel:s.sel,pop:null};});}},
        h('div',{style:{display:'flex',alignItems:'center',gap:4,marginBottom:3}},
          h('span',{style:{fontSize:7,fontWeight:600,color:'#9eaab8',
            textTransform:'uppercase',letterSpacing:.6,
            fontFamily:"'IBM Plex Mono',monospace"}},label),
          h('button',{className:'help-btn'+(openPop===popKey?' active':''),
            onClick:function(e){e.stopPropagation();tPop(popKey);},'aria-label':'Saiba mais'},'ⓘ')
        ),
        h('div',{style:{fontSize:12,fontWeight:700,
          fontFamily:"'IBM Plex Mono',monospace",color:vc,lineHeight:1.2}},val),
        h('div',{style:{fontSize:7,color:'#9eaab8',
          fontFamily:"'IBM Plex Mono',monospace",marginTop:2}},sub),
        Pop(popKey,isRight)
      );
    }

    stripEl=h('div',{style:{display:'flex',borderTop:'1px solid #f0f2f5'}},
      Cell3('Posição histórica','pct',
        sm&&sm.pct!=null?'P'+sm.pct:'—',
        sahe.p10!=null?'P10='+sahe.p10+' · P90='+sahe.p90:'',
        pctC,false),
      Cell3('Por acaso?','poi',
        sm&&sm.p_poi!=null?'p = '+fmtP(sm.p_poi)+(sig?' ✱':''):'—',
        sig?'improvável por acaso':'variação esperada',
        sig?sigC:okC,false),
      Cell3('Tendência','mk',
        sahe.mk_tau!=null?(mkDir+sahe.mk_tau):'—',
        'Sen='+(sahe.sen!=null?(sahe.sen>0?'+':'')+sahe.sen:' —')+'/mês · p='+fmtP(sahe.mk_p),
        mkSig?sigC:neuC,true)
    );

    var currPtP=defPt;
    if(selPt&&selPt!==currPtP){
      stripEl=h('div',null,
        h('div',{style:{padding:'3px 11px',background:'#f0f4f8',fontSize:7.5,
          color:'#4a5568',fontFamily:"'IBM Plex Mono',monospace",
          borderTop:'1px solid #e8eaed'}},
          '← mostrando '+selPt+' · clique em outra barra para alternar'),
        stripEl
      );
    }
  }

  var chartMargin={top:4,right:sahe?50:4,left:-28,bottom:0};

  return h('div',{style:{background:WHITE,
    border:'1px solid '+(zona==='epidemica'?'#e57373':BRDR),
    borderRadius:8,padding:'14px 14px 0',
    boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}},
    h('div',{style:{display:'flex',justifyContent:'space-between',
      alignItems:'flex-start',marginBottom:8}},
      h('span',{style:{fontFamily:"'IBM Plex Sans',sans-serif",fontSize:11,fontWeight:600,
        color:NAVY,maxWidth:'75%',lineHeight:1.35}},title,mkEl),
      badgeEl
    ),
    h(RCont,{width:'100%',height:ht},
      h(ComposedChart,{data:data,margin:chartMargin,
          onClick:function(e){if(e&&e.activePayload&&e.activePayload.length)
            selBar(e.activePayload[0].payload.p);}},
        h(CartGrid,{strokeDasharray:'3 3',stroke:GRID,vertical:false}),
        h(XAxis,{dataKey:'p',tick:{fill:LIGHT,fontSize:8,
          fontFamily:"'IBM Plex Mono',monospace"},axisLine:false,tickLine:false}),
        h(YAxis,{tick:{fill:LIGHT,fontSize:8,
          fontFamily:"'IBM Plex Mono',monospace"},axisLine:false,tickLine:false,
          domain:[0,maxY||'auto']}),
        h(RCTip,{content:makeTip(unit)}),
        sahe&&sahe.p90!=null?h(RefArea,{y1:sahe.p90,
          y2:maxY||(sahe.p90*1.6),fill:'#ffebee',fillOpacity:.4,ifOverflow:'visible'}):null,
        sahe&&sahe.p75!=null?h(RefArea,{y1:sahe.p75,y2:sahe.p90,
          fill:'#fff8e1',fillOpacity:.5}):null,
        sahe&&sahe.p90!=null?h(RefLine,{y:sahe.p90,stroke:'#c62828',
          strokeDasharray:'5 3',strokeWidth:1.1,opacity:.7,
          label:{value:'P90',position:'right',fill:'#c62828',fontSize:6}}):null,
        sahe&&sahe.p75!=null?h(RefLine,{y:sahe.p75,stroke:AMBER,
          strokeDasharray:'4 3',strokeWidth:1,opacity:.65,
          label:{value:'P75',position:'right',fill:AMBER,fontSize:6}}):null,
        sahe&&sahe.p50!=null?h(RefLine,{y:sahe.p50,stroke:HIST,
          strokeDasharray:'3 2',strokeWidth:1.2,
          label:{value:'P50',position:'right',fill:HIST,fontSize:6}}):null,
        sahe&&sahe.p10!=null?h(RefLine,{y:sahe.p10,stroke:GREEN,
          strokeDasharray:'4 3',strokeWidth:1,opacity:.65,
          label:{value:'P10',position:'right',fill:GREEN,fontSize:6}}):null,
        refY!=null?h(RefLine,{y:refY,stroke:AMBER,strokeDasharray:'4 2',strokeWidth:1,
          label:{value:refLbl||'',fill:AMBER,fontSize:7,position:'insideTopRight'}}):null,
        h(Bar,{dataKey:'v',radius:[3,3,0,0],style:{cursor:sahe?'pointer':'default'}},
          data.map(function(d,i){
            var isCurr=d.c,isSel=selPt&&d.p===selPt;
            var fill=isCurr?currColor:HIST;
            var op=isCurr?1:isSel?.85:.7;
            return h(Cell,{key:i,fill:fill,opacity:op,
              strokeWidth:isSel&&!isCurr?1.5:0,

          })),
        hasLim?h(Line,{type:'linear',dataKey:'lMax',stroke:RED,strokeDasharray:'5 3',
          strokeWidth:1.5,dot:false,connectNulls:false,legendType:'none'}):null,
        hasLim?h(Line,{type:'linear',dataKey:'lMin',stroke:GREEN,strokeDasharray:'5 3',
          strokeWidth:1.5,dot:false,connectNulls:false,legendType:'none'}):null
      )
    ),
    stripEl,
    note?h('div',{style:{fontSize:8,color:MUTED,padding:'4px 0 8px',
      fontFamily:"'IBM Plex Mono',monospace"}},note):null,
    sahe?h('div',{style:{fontSize:7,color:'#b0bac8',padding:'0 0 7px',

  );
}

        border:'1px solid '+(cob!=null&&cob<50?AMBER:BRDR),

          color:NAVY,marginBottom:8}},'Competência '+lastChk.p),
        h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:6}},
          h('span',{style:{fontSize:11,color:SLATE}},'Cobertura'),
          h('span',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:18,fontWeight:700,

          h('span',{style:{fontSize:11,color:SLATE}},'Conformidade'),
          h('span',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:18,fontWeight:700,
            color:conf>=80?GREEN:conf>=50?AMBER:conf!=null?RED:MUTED}},

         lastChk.nc_material>0||lastChk.nc_puncao>0)?h('div',{style:{fontSize:9,color:MUTED}},

          lastChk.nc_sitio>0?h('div',{},'Mudança de sítio: '+lastChk.nc_sitio):null,

          lastChk.nc_degerm>0?h('div',{},'Degermação: '+lastChk.nc_degerm):null,
          lastChk.nc_material>0?h('div',{},'Conta material: '+lastChk.nc_material):null,
          lastChk.nc_puncao>0?h('div',{},'Múltiplas punções: '+lastChk.nc_puncao):null
        ):null
      )
    )
  );
}

function DiarreiaSection(props){
  var D=props.D;
  var dd=D.diarreia||{};

  var DUNITS=[
    {key:'utiab',label:'UTI A/B',    color:RED},
    {key:'utic', label:'UTI C',      color:PURPLE},
    {key:'cm',   label:'Cl. Médica', color:BLUE},
    {key:'cc',   label:'Cl. Cirúrgica',color:GREEN},
    {key:'epm',  label:'EPM / Apto', color:AMBER},
  ];

  // Build timeline from the cm series (longest/most complete)
  var ref=dd.cm||[];
  if(!ref.length) return h('div',{className:'fi'},h('div',{style:{color:MUTED,padding:24,fontSize:12}},'Sem dados de diarreia disponíveis.'));

  var lastLbl=(ref[ref.length-1]||{}).p||'';
  var currYr=(lastLbl.split('/')[1])||'';

  var allLabels=ref.map(function(pt){return pt.p;});

  var chartData=allLabels.map(function(lbl){
    var ptYr=(lbl.split('/')[1])||'';
    var prev=ptYr!==currYr;
    var row={m:lbl,prev:prev};
    DUNITS.forEach(function(u){
      var series=dd[u.key]||[];
      var pt=series.find(function(s){return s.p===lbl;})||{};
      var v=pt.v!=null?pt.v:null;
      row[u.key]=v;
      row[u.key+'_prev']=prev?v:null;
      row[u.key+'_curr']=!prev?v:null;
      // Share boundary point so lines connect across year boundary
      var prevPt=allLabels.indexOf(lbl)>0&&allLabels[allLabels.indexOf(lbl)-1];
      if(!prev&&prevPt&&(prevPt.split('/')[1])!==currYr) row[u.key+'_prev']=v;
    });
    return row;
  });

  var pvFirst=null,pvLast=null;
  chartData.forEach(function(d){if(d.prev){if(!pvFirst)pvFirst=d.m;pvLast=d.m;}});

  // KPI strip — latest value per unit
  var kpis=DUNITS.map(function(u){
    var series=dd[u.key]||[];
    var curr=null,currLbl='—';
    for(var i=series.length-1;i>=0;i--){
      if(series[i].v!=null){curr=series[i].v;currLbl=series[i].p;break;}
    }
    var prev=null;
    var ci=series.findIndex(function(s){return s.v===curr&&s.p===currLbl;});
    for(var j=ci-1;j>=0;j--){
      if(series[j].v!=null){prev=series[j].v;break;}
    }
    var trend=curr===null?'—':prev===null?'→':curr>prev?'↑':curr<prev?'↓':'→';
    return {u:u,curr:curr,currLbl:currLbl,trend:trend};
  });

  function makeTipDiarr(){
    return function T(p){
      if(!p.active||!p.payload||!p.payload.length) return null;
      var items=p.payload.filter(function(x){return x.value!=null&&x.value>0;})
        .sort(function(a,b){return b.value-a.value;});
      if(!items.length) return null;
      return h('div',{style:{background:WHITE,border:'1px solid '+BRDR,borderRadius:6,
        padding:'10px 14px',fontSize:12,boxShadow:'0 2px 8px rgba(0,0,0,0.12)',minWidth:180}},
        h('div',{style:{color:LIGHT,fontSize:10,marginBottom:6}},'Diarreia /1000 pac-dia · '+p.label),
        items.map(function(it,i){
          return h('div',{key:i,style:{display:'flex',justifyContent:'space-between',gap:14,marginBottom:2}},
            h('span',{style:{color:SLATE,fontSize:11}},it.name),
            h('span',{style:{color:it.color,fontFamily:"'IBM Plex Mono',monospace",fontSize:11,fontWeight:700}},
              it.value.toFixed(2))
          );
        })
      );
    };
  }

  return h('div',{className:'fi'},
    // KPI strip
    h('div',{style:{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}},
      kpis.map(function(k,i){
        var ok=k.curr==null||k.curr<20;
        return h('div',{key:i,style:{background:WHITE,border:'1px solid '+(ok?BRDR:k.u.color+'55'),
          borderRadius:8,padding:'10px 14px',flex:'1',minWidth:120,
          boxShadow:ok?'0 1px 3px rgba(0,0,0,0.06)':'0 2px 8px '+k.u.color+'22',
          position:'relative',overflow:'hidden'}},
          h('div',{style:{position:'absolute',top:0,left:0,width:'100%',height:3,background:k.u.color}}),
          h('div',{style:{fontSize:9,color:SLATE,marginBottom:4,marginTop:2}},k.u.label),
          h('div',{style:{display:'flex',alignItems:'baseline',gap:6}},
            k.curr!=null
              ?h('span',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:26,fontWeight:700,
                  color:ok?NAVY:k.u.color,lineHeight:1}},k.curr.toFixed(1))

  var cd=D[which];
  var lbl=labels[which];

  // infSeries: série mensal de contagens por tipo (nova)
  var inf=cd.infSeries||[];
  var lastInf=inf.filter(function(p){return p.c;})[0]||inf[inf.length-1]||null;

  // Séries por tipo de IrAS (derivadas de infSeries)
  var acData=inf.map(function(p){return{p:p.p,v:p.ac,c:p.c};});
  var ituData=inf.map(function(p){return{p:p.p,v:p.itu,c:p.c};});
  var pneuData=inf.map(function(p){return{p:p.p,v:p.pneu,c:p.c};});
  var iscData=inf.map(function(p){return{p:p.p,v:p.isc||0,c:p.c};});
  var hasIsc=which!=='clinicaMedica';

// ── HM Álcool gel ──────────────────────────────────────────────────
cd.hm&&cd.hm.length>0?h(BarS,{title:'Higiene das Mãos — Álcool Gel (ml/pac-dia)',

function IsolamentosSection(props){
  var D=props.D;
  var isol=D.isolamentos||{};
  var conf=isol.confirmados_pc||{};
  var novos=isol.novos_total||{};

  var UNITS=[
    {key:'utiAB',           label:'UTI A/B',          col:'#c62828'},
    {key:'utic',            label:'UTI C',             col:'#1565c0'},
    {key:'utiNeo',          label:'UTI Neo/CI',        col:'#4527a0'},
    {key:'clinicaMedica',   label:'Clínica Médica',    col:'#2e7d32'},
    {key:'clinicaCirurgica',label:'Clínica Cirúrgica', col:'#e65100'},
    {key:'epm',             label:'EPM',               col:'#00695c'},
    {key:'apartamento',     label:'Apartamento',       col:'#5d4037'},
    {key:'pediatria',       label:'Pediatria/BR',      col:'#6a1b9a'},
  ];

  function lastPt(series){ return(series&&series.length)?series[series.length-1]:null; }

  // KPI card por unidade
  function UnitCard(u){
    var cPts=conf[u.key]||[];
    var nPts=novos[u.key]||[];
    var cLast=lastPt(cPts);
    var nLast=lastPt(nPts);
    var pct=cLast?cLast.pct:null;
    var border=pct!=null&&pct>20?'2px solid '+u.col:'1px solid '+BRDR;
    return h('div',{style:{background:WHITE,border:border,borderRadius:8,
      padding:'12px 14px',boxShadow:'0 1px 3px rgba(0,0,0,.06)'}},
      h('div',{style:{fontSize:9,color:u.col,fontWeight:600,marginBottom:6,
        letterSpacing:.3,textTransform:'uppercase'}},u.label),
      h('div',{style:{display:'flex',alignItems:'baseline',gap:6,marginBottom:4}},
        h('span',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:24,
          fontWeight:700,color:pct!=null&&pct>20?u.col:SLATE,lineHeight:1}},
          pct!=null?pct.toFixed(1)+'%':'—'),
        h('span',{style:{fontSize:9,color:MUTED}},'pac-dia em PC')
      ),
      h('div',{style:{fontSize:9,color:MUTED}},
        nLast?'↑ '+nLast.n+' casos novos ('+nLast.p+')':'sem dados'
      ),
      // mini trend bar
      cPts.length>1?h('div',{style:{display:'flex',alignItems:'flex-end',gap:2,
        marginTop:8,height:28}},
        cPts.map(function(pt,i){
          var h_=Math.max(2,Math.round((pt.pct||0)/40*28));
          var isCurr=pt.c||i===cPts.length-1;
          return h('div',{key:i,title:pt.p+': '+pt.pct+'%',
            style:{flex:1,height:h_,borderRadius:'2px 2px 0 0',
              background:u.col,opacity:isCurr?1:.35}});
        })
      ):null
    );
  }

  // Série histórica de % pac-dia por unidade (BarS)
  function toPct(series){
    return (series||[]).map(function(pt){return{p:pt.p,v:pt.pct,c:pt.c};});
  }

  return h('div',{className:'fi'},
    h(SH,{t:'Precaução de Contato — % Pac-Dia · Competência Atual'}),
    h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:16}},
      UNITS.map(function(u){return h('div',{key:u.key},UnitCard(u));})
    ),
    h(SH,{t:'Série Histórica — % Pac-Dia em Precaução de Contato (MDR + Outros)'}),
    h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:16}},
      UNITS.map(function(u){
        var pts=toPct(conf[u.key]);
        return pts.length>0?h(BarS,{key:u.key,title:u.label,
          data:pts,unit:'%',maxY:50,h:160}):null;
      })
    ),
    h(SH,{t:'Casos Novos em Qualquer Precaução / Isolamento — n por mês'}),
    h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}},
      UNITS.map(function(u){
        var pts=(novos[u.key]||[]).map(function(pt){return{p:pt.p,v:pt.n,c:pt.c};});
        return pts.length>0?h(BarS,{key:u.key,title:u.label,
          data:pts,maxY:20,h:140}):null;
      })
    )
  );
}
// ── SuraSection ───────────────────────────────────────────────────────────────
function SuraSection(props){
  var D=props.D;
  var sd=D.sura;
  if(!sd||!sd.s||!sd.s.length) return h('div',{className:'fi'},
    h('div',{style:{color:MUTED,fontSize:11,padding:20}},'Sem dados SURA disponíveis.'));
  var pts=sd.s;
  var last=pts[pts.length-1];

  function derive(pt){
    var tp=pt.mantido+pt.semAtb+pt.troca+pt.alta+pt.obito;
    var anal=pt.mantido+pt.semAtb+pt.troca;
    var ades=pt.semAtb+pt.troca;
    return {
      pct_neg: pt.sol>0?Math.round(pt.neg/pt.sol*100):null,
      n_pos:   pt.sol-pt.neg,
      pct_pos: pt.sol>0?Math.round((pt.sol-pt.neg)/pt.sol*100):null,
      tp:tp, anal:anal, ades:ades,
      pct_ades:anal>0?Math.round(ades/anal*100):null,
      pct_alta:tp>0?Math.round(pt.alta/tp*100):null
    };
  }
  var d=derive(last);
  var trendPts=pts.map(function(pt){
    var dv=derive(pt); return {p:pt.p,neg:dv.pct_neg,ades:dv.pct_ades,alta:dv.pct_alta,c:pt.c||0};
  });

  // ── Threshold state ──
  var stC0=d.pct_neg!=null&&d.pct_neg>50?'warn':'neutral';
  var stC1=d.pct_ades==null?'neutral':d.pct_ades>50?'good':d.pct_ades<40?'warn':'neutral';
  var stC2=d.pct_alta==null?'neutral':d.pct_alta>20?'alert':d.pct_alta>15?'warn':'neutral';
  function stCol(st){return st==='good'?TEAL:st==='warn'?AMBER:st==='alert'?RED:SLATE;}
  function stBar(st){return st==='good'?TEAL:st==='warn'?AMBER:st==='alert'?RED:'#cbd5e1';}

  // ── Sub-components ──
  function GBar(pct,st){
    return h('div',{style:{height:7,borderRadius:4,background:'#eaedf0',overflow:'hidden',marginBottom:4}},
      h('div',{style:{height:7,width:(pct||0)+'%',borderRadius:4,background:stBar(st)}}));
  }
  function TChip(label,st,msg){
    var c=stCol(st);
    return h('div',{style:{display:'flex',alignItems:'center',gap:6,margin:'6px 0 12px'}},
      h('span',{style:{fontSize:7,fontWeight:600,letterSpacing:.5,padding:'2px 8px',
        borderRadius:10,border:'1px solid '+(st!=='neutral'?c:BRDR),
        color:st!=='neutral'?c:MUTED,background:WHITE}},label),
      h('span',{style:{fontSize:7,color:st!=='neutral'?c:MUTED}},msg));
  }
  function MiniTrend(key,maxPct,stFn){
    var maxH=52;
    return h('div',{style:{display:'flex',alignItems:'flex-end',gap:4,height:maxH+20}},
      trendPts.map(function(tp,i){
        var v=tp[key]; if(v==null) return null;
        var hh=Math.max(4,Math.round(v/maxPct*maxH));
        var st=stFn(v); var isLast=i===trendPts.length-1;
        return h('div',{key:i,style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center'}},
          h('div',{style:{width:'100%',height:hh,borderRadius:'2px 2px 0 0',
            background:stBar(st),opacity:isLast?1:.5}}),
          h('div',{style:{fontSize:7,color:MUTED,fontFamily:"'IBM Plex Mono',monospace",marginTop:2}},
            tp.p.split('/')[0]),
          h('div',{style:{fontSize:7,color:MUTED}},v+'%'));
      }));
  }

  var cBase={background:WHITE,border:'1px solid '+BRDR,borderRadius:8,
    padding:16,boxShadow:'0 1px 3px rgba(0,0,0,.06)'};

  return h('div',{className:'fi'},
    h(LimLegenda),
    // ── Row 1: Cards 0 + 1 ──
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}},

      // Card 0 — Pareceres emitidos
      h('div',{style:Object.assign({},cBase,stC0!=='neutral'?{borderColor:stCol(stC0)}:{})},
        h('div',{style:{fontSize:8,fontWeight:600,letterSpacing:.5,textTransform:'uppercase',color:MUTED,marginBottom:8}},
          'Pareceres Emitidos'),
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}},
          h('div',{style:{background:'#f4f5f7',borderRadius:6,padding:'10px 10px 8px',textAlign:'center'}},

            h('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:28,fontWeight:700,

            h('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,fontWeight:600,

            h('div',{style:{fontSize:7,color:MUTED,marginTop:3}},'aprovados'))),

      // Card 1 — Adesão
      h('div',{style:Object.assign({},cBase,stC1!=='neutral'?{borderColor:stCol(stC1)}:{})},
        h('div',{style:{fontSize:8,fontWeight:600,letterSpacing:.5,textTransform:'uppercase',color:MUTED,marginBottom:8}},
          'Adesão ao Parecer'),

        h(SH,{t:'Detalhe — '+last.p}),

            h('div',{style:{width:7,height:7,borderRadius:'50%',background:col,flexShrink:0}}),
            h('div',{style:{fontSize:8,color:SLATE,flex:1}},lbl),
            h('div',{style:{width:58,height:5,background:'#eaedf0',borderRadius:3,overflow:'hidden',flexShrink:0}},
              h('div',{style:{width:pctV+'%',height:5,background:col,borderRadius:3}})),
            h('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:8,color:MUTED,
              width:44,textAlign:'right',flexShrink:0}},v+' ('+pctV+'%)'));
        }),
        h(SH,{t:'Tendência — % adesão'}),
        MiniTrend('ades',100,function(v){return v>50?'good':v<40?'warn':'neutral';}),
        h('div',{style:{fontSize:7,color:MUTED,background:'#f4f5f7',borderRadius:4,
          padding:'6px 8px',marginTop:10,lineHeight:1.5}},
          '📌 Denominador analisável: ',last.mantido+last.semAtb+last.troca,
          ' dos ',d.tp,' pareceres · Alta (',last.alta,') e Óbito (',last.obito,') excluídos')
      )
    ),

    // ── Card 2: Alta precoce (landscape) ──
    h('div',{style:Object.assign({},cBase,{
      display:'flex',gap:0,padding:0,overflow:'hidden',
      borderColor:stC2!=='neutral'?stCol(stC2):BRDR,
      borderLeftWidth:stC2!=='neutral'?3:1,
      borderLeftColor:stC2!=='neutral'?stCol(stC2):BRDR
    })},
      // Left panel
      h('div',{style:{width:230,flexShrink:0,padding:16,
        borderRight:'1px solid '+BRDR,display:'flex',flexDirection:'column'}},
        h('div',{style:{fontSize:8,fontWeight:600,letterSpacing:.5,textTransform:'uppercase',
          color:MUTED,marginBottom:8}},'Alta Precoce'),
        h('div',{style:{fontSize:10,fontWeight:600,color:NAVY,marginBottom:2,lineHeight:1.3}},
          'Alta <72h após Solicitação de ATB'),
        h('div',{style:{fontSize:8,color:MUTED,lineHeight:1.4,marginBottom:14}},
          'Proxy de indicação possivelmente desnecessária'),
        h('div',{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:46,fontWeight:700,
          lineHeight:1,color:stCol(stC2),marginBottom:4}},
          d.pct_alta!=null?d.pct_alta+'%':'—'),
        h('div',{style:{fontSize:8,color:MUTED,marginBottom:10}},
          last.alta+' de '+d.tp+' pareceres · '+last.p),
        GBar(d.pct_alta,stC2),
        TChip('limiar > 15%',stC2,d.pct_alta!=null?
          (stC2==='alert'?'⚠ muito acima':stC2==='warn'?'⚠ acima':d.pct_alta+'% — abaixo'):'—'),
        h('div',{style:{fontSize:8,color:SLATE,
          background:stC2!=='neutral'?'#fff8f5':'#f8f9fa',
          border:'1px solid '+(stC2!=='neutral'?stCol(stC2)+'33':BRDR),
          borderRadius:5,padding:'8px 10px',lineHeight:1.55,marginTop:'auto'}},
          h('strong',{style:{color:stCol(stC2)}},
            d.pct_alta!=null?'1 em ~'+Math.round(100/Math.max(d.pct_alta,1)):' '),
          ' pacientes com ATB solicitado recebeu alta em <72h.')
      ),
      // Right panel: spark + dot map
      h('div',{style:{flex:1,padding:16,display:'flex',flexDirection:'column'}},
        h(SH,{t:'Tendência mensal — % alta <72h · limiar 15%'}),
        h('div',{style:{position:'relative',height:94,marginBottom:8}},
          h('div',{style:{position:'absolute',left:0,right:0,
            bottom:Math.round(15/35*78),
            borderTop:'1.5px dashed '+AMBER,opacity:.5}}),
          h('div',{style:{position:'absolute',right:0,
            bottom:Math.round(15/35*78)+2,fontSize:6,color:AMBER,
            fontFamily:"'IBM Plex Mono',monospace",background:WHITE,padding:'0 2px'}},
            'limiar 15%'),
          h('div',{style:{display:'flex',alignItems:'flex-end',gap:8,height:'100%'}},
            trendPts.map(function(tp,i){
              if(tp.alta==null) return null;
              var maxP=35,maxH=78;
              var hh=Math.max(4,Math.round(tp.alta/maxP*maxH));
              var st2=tp.alta>20?'alert':tp.alta>15?'warn':'neutral';
              var isLast=i===trendPts.length-1;
              return h('div',{key:i,style:{flex:1,display:'flex',flexDirection:'column',
                alignItems:'center',height:'100%',justifyContent:'flex-end'}},
                h('div',{style:{width:'100%',height:hh,borderRadius:'2px 2px 0 0',
                  background:stCol(st2),opacity:isLast?1:.5}}),
                h('div',{style:{fontSize:7,color:MUTED,fontFamily:"'IBM Plex Mono',monospace",marginTop:2}},
                  tp.p.split('/')[0]),
                h('div',{style:{fontSize:7,color:MUTED}},tp.alta+'%'));
            }))
        ),
        h(SH,{t:'Mapa de pareceres — '+last.p+' · ■ = 1 parecer · destaque = alta <72h'}),
        h('div',{style:{display:'flex',flexWrap:'wrap',gap:3}},
          (function(){
            var tot=Math.min(d.tp,80), nHL=Math.min(last.alta,tot);
            var dots=[];
            for(var i=0;i<tot;i++){
              dots.push(h('div',{key:i,style:{width:10,height:10,borderRadius:2,
                background:i<nHL?stCol(stC2):'#d0d7de',opacity:i<nHL?1:.3}}));
            }
            return dots;
          })()
        )
      )
    )
  );
}

var NAV=[
  {id:'overview',l:'Visão Geral',g:'Institucional',ic:'◈'},
  {id:'mdrInst',l:'Multirresistentes',g:'Institucional',ic:'⬡'},
  {id:'abio',l:'Antibiograma',g:'Institucional',ic:'⬟'},
  {id:'utiAB',l:'UTI A/B',g:'Unidades Críticas',ic:'▣'},
  {id:'utic',l:'UTI C',g:'Unidades Críticas',ic:'▣'},
  {id:'utiNeo',l:'UTI Neonatal',g:'Unidades Críticas',ic:'◉'},
  {id:'hd',l:'Hemodiálise',g:'Unidades Críticas',ic:'◈'},
  {id:'clinicaMedica',l:'Clínica Médica',g:'Enfermarias',ic:'▤'},
  {id:'clinicaCirurgica',l:'Clínica Cirúrgica',g:'Enfermarias',ic:'▤'},
  {id:'epm',l:'EPM / Apartamentos',g:'Enfermarias',ic:'▤'},
  {id:'diarreia',l:'Diarreia Hospitalar',g:'Vigilâncias Especiais',ic:'◎'},
  {id:'sura',l:'Uso Racional de ATB',g:'Stewardship',ic:'◑'},
  {id:'isolamentos',l:'Precauções de Contato',g:'Stewardship',ic:'⊘'}
];
var TITLES={overview:'Visão Geral — IrAS & MDR',mdrInst:'Multirresistentes — Institucional',
  abio:'Antibiograma Institucional',utiAB:'UTI A/B',utic:'UTI C',
  utiNeo:'UTI Neonatal',hd:'Hemodiálise / Nefrologia',clinicaMedica:'Clínica Médica',
  clinicaCirurgica:'Clínica Cirúrgica',epm:'EPM / Apartamentos',
  diarreia:'Diarreia Hospitalar',sura:'Sistema de Uso Racional de ATB',
  isolamentos:'Precauções de Contato e Isolamentos'};
var groups=NAV.reduce(function(acc,n){if(n.g&&acc.indexOf(n.g)===-1)acc.push(n.g);return acc;},[]);

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  var s1=useState('overview'); var active=s1[0],setActive=s1[1];
  var s2=useState(null);       var D=s2[0],setD=s2[1];
  var s3=useState(true);       var loading=s3[0],setLoading=s3[1];

  useEffect(function(){
    setD(FB); setLoading(false);
    fetch('./data_sahe.json?t='+Date.now())
      .then(function(r){return r.ok?r.json():null;})
      .then(function(d){if(d){SAHE=d;}})
      .catch(function(){});
   fetch('./data_stats.json?t='+Date.now())
      .then(function(r){return r.ok?r.json():null;})
      .then(function(d){if(d){STATS=d;}})
      .catch(function(){});
    fetch('./data_iras.json?t='+Date.now())
      .then(function(r){return r.json();})
      .then(function(d){
        // ── Helper: merge FB points missing from JSON series by label ──────────
        function mergeFBPoints(jsArr, fbArr) {
          if(!Array.isArray(jsArr)||!Array.isArray(fbArr)) return jsArr;
          var jsLabels={};
          jsArr.forEach(function(pt){ jsLabels[pt.p]=true; });
          var missing=fbArr.filter(function(pt){ return !pt.c&&!jsLabels[pt.p]; });
          if(!missing.length) return jsArr;
          // Insert missing FB points in chronological position
          var combined=missing.concat(jsArr);
          // Sort: annual (4-digit) before monthly (mmm/yy), then by year/month
          var MO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
          combined.sort(function(a,b){
            function rank(p){
              if(/^\d{4}$/.test(p)) return parseInt(p)*100-1;
              var parts=p.split('/');
              return (2000+parseInt(parts[1]))*100+MO.indexOf(parts[0]);
            }
            return rank(a.p)-rank(b.p);
          });
          return combined;
        }

        // ── Restore lMin/lMax from FB + add missing FB points ─────────────────
        var MERGE_SERIES={
          utiAB:['svd','cvc','tot','pav','itu','ipcs','dddPip','dddCarba','dddGlico','dddPoli','hm'],
          utic: ['svd','cvc','tot','pav','itu','ipcs','dddPip','dddCarba','dddGlico','dddPoli','hm'],
          utiNeo:['ipcs'],
          hd:['ilav','bact','vanco'],
          clinicaMedica:['taxaIH'],
          clinicaCirurgica:['taxaIH'],
          epm:['taxaIH'],
          global:['taxaIH']
        };
        Object.keys(MERGE_SERIES).forEach(function(unit){
          if(!d[unit]||!FB[unit]) return;
          MERGE_SERIES[unit].forEach(function(key){
            var jsArr=d[unit][key], fbArr=FB[unit][key];
            if(!Array.isArray(jsArr)||!Array.isArray(fbArr)) return;
            // 1. Add missing FB points
            jsArr=mergeFBPoints(jsArr,fbArr);
            // 2. Restore lMin/lMax for points that have them in FB
            var fbMap={};
            fbArr.forEach(function(pt){ if(pt.lMin!=null||pt.lMax!=null) fbMap[pt.p]=pt; });
            d[unit][key]=jsArr.map(function(pt){
              var fb=fbMap[pt.p];
              if(!fb) return pt;
              var merged=Object.assign({},pt);
              if(fb.lMin!=null) merged.lMin=fb.lMin;
              if(fb.lMax!=null) merged.lMax=fb.lMax;
              return merged;
            });
          });
        });

        // ── Inject limiares from JSON into most recent historical point ────────
        // (the point that was c:1 last month, now historical — carries this month's thresholds)
        var LIM_MAP={
          svd:     {max:'svdMax',  min:'svdMin'},
          cvc:     {max:'cvcMax',  min:'cvcMin'},
          tot:     {max:'totMax',  min:'totMin'},
          pav:     {max:'pavMax',  min:null},
          itu:     {max:'ituMax',  min:null},
          ipcs:    {max:'ipcsMax', min:null},
          dddPip:  {max:'pipMax',  min:'pipMin'},
          dddCarba:{max:'carbaMax',min:'carbaMin'},
          dddGlico:{max:'glicoMax',min:'glicoMin'},
          dddPoli: {max:'poliMax', min:'poliMin'}
        };
        ['utiAB','utic'].forEach(function(unit){
          var lim=d[unit]&&d[unit].limiares;
          if(!lim) return;
          Object.keys(LIM_MAP).forEach(function(key){
            var arr=d[unit][key];
            if(!Array.isArray(arr)||!arr.length) return;
            // Inject into last historical point AND current c:1 point
            var lastHistIdx=-1,currIdx=-1;
            for(var i=arr.length-1;i>=0;i--){
              if(arr[i].c&&currIdx<0) currIdx=i;
              else if(!arr[i].c&&lastHistIdx<0) lastHistIdx=i;
              if(lastHistIdx>=0&&currIdx>=0) break;
            }
            var m=LIM_MAP[key];
            arr=arr.slice();
            [lastHistIdx,currIdx].forEach(function(idx){
              if(idx<0) return;
              var pt=Object.assign({},arr[idx]);
              if(m.max&&lim[m.max]!=null) pt.lMax=lim[m.max];
              if(m.min&&lim[m.min]!=null) pt.lMin=lim[m.min];
              arr[idx]=pt;
            });
            d[unit][key]=arr;
          });
        });
        // Neo ipcsMax
        if(d.utiNeo&&d.utiNeo.limiares&&d.utiNeo.ipcs){
          var neoLim=d.utiNeo.limiares.ipcsMax;
          var neoArr=d.utiNeo.ipcs;
          var lastHistIdx=-1;
          for(var i=neoArr.length-1;i>=0;i--){ if(!neoArr[i].c){lastHistIdx=i;break;} }
          if(lastHistIdx>=0&&neoLim!=null){
            var pt=Object.assign({},neoArr[lastHistIdx]);
            pt.lMax=neoLim;
            neoArr=neoArr.slice(); neoArr[lastHistIdx]=pt;
            d.utiNeo.ipcs=neoArr;
          }
        }

        // ── auditSeries: merge FB historical + JSON ────────────────────────────
        ['utiAB','utic','utiNeo'].forEach(function(unit){
          var fbAs=FB[unit]&&FB[unit].auditSeries;
          var jAs=d[unit]&&d[unit].auditSeries;
          if(!Array.isArray(fbAs)) return;
          if(!Array.isArray(jAs)||!jAs.length){
            if(d[unit]) d[unit].auditSeries=fbAs;
            return;
          }
          // Merge: FB as base, JSON points override/extend
          var map={};
          fbAs.forEach(function(x){ map[x.p]=x; });
          jAs.forEach(function(x){ map[x.p]=x; });
          var merged=Object.keys(map).map(function(k){ return map[k]; });
          var MO2=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
          merged.sort(function(a,b){
            function rank(p){
              if(/^\d{4}$/.test(p)) return parseInt(p)*100-1;
              var parts=p.split('/');
              return (2000+parseInt(parts[1]))*100+MO2.indexOf(parts[0]);
            }
            return rank(a.p)-rank(b.p);
          });
          d[unit].auditSeries=merged;
        });

        // ── HD monthly: merge FB historical + current JSON point ──────────────
        var HD_MONTHLY=['ilavTemp','ilavPerm','bactTemp','bactPerm'];
        if(d.hd){
          HD_MONTHLY.forEach(function(k){
            var jv=d.hd[k], fbv=FB.hd&&FB.hd[k];
            if(!Array.isArray(jv)||!Array.isArray(fbv)) return;
            var onlyCurr=jv.length>0&&jv.every(function(x){return x.c;});
            if(onlyCurr){
              var currLabel=jv[0].p;
              var hist=fbv.filter(function(x){return !x.c&&x.p!==currLabel;});
              d.hd[k]=hist.concat(jv);
            }
          });
        }

        // ── Diarreia ──────────────────────────────────────────────────────────
        if(d.diarreia){
          var DIARR_KEYS=['cm','cc','epm','utiab','utic'];
          DIARR_KEYS.forEach(function(k){
            var jv=d.diarreia[k], fbv=FB.diarreia&&FB.diarreia[k];
            if(!Array.isArray(jv)||!Array.isArray(fbv)) return;
            var onlyCurr=jv.length>0&&jv.every(function(x){return x.c;});
            if(onlyCurr){
              var currLabel=jv[0].p;
              var hist=fbv.filter(function(x){return !x.c&&x.p!==currLabel;});
              d.diarreia[k]=hist.concat(jv);
            }
          });
        }

        // ── sura: merge FB + JSON ─────────────────────────────────────────────
        var MO3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
        function rankMes(p){var parts=p.split('/');return (2000+parseInt(parts[1]))*100+MO3.indexOf(parts[0]);}
        if(d.sura&&Array.isArray(d.sura.s)&&d.sura.s.length){
          var fbS=FB.sura&&FB.sura.s;
          if(Array.isArray(fbS)&&fbS.length){
            var sm={};
            fbS.forEach(function(x){sm[x.p]=x;});
            d.sura.s.forEach(function(x){sm[x.p]=x;});
            var smArr=Object.keys(sm).map(function(k){return sm[k];});
            smArr.sort(function(a,b){return rankMes(a.p)-rankMes(b.p);});
            d.sura={s:smArr};
          }
        } else if(FB.sura){
          d.sura=FB.sura;
        }

        setD(d);
      })
      .catch(function(){});
  },[]);

  if(loading) return h('div',{style:{display:'flex',alignItems:'center',
    justifyContent:'center',height:'100vh',flexDirection:'column',gap:14}},
    h('div',{className:'pulse',style:{width:36,height:36,borderRadius:'50%',
      background:BLUE,opacity:.4}}),
    h('div',{style:{color:SLATE,fontSize:12}},'Carregando dados...')
  );

  function renderSection(){
    switch(active){
      case 'overview':         return h(OverviewSection,{D:D});
      case 'mdrInst':          return h(MdrInstSection,{D:D});
      case 'abio':             return h(AbioSection,{D:D});
      case 'utiAB':            return h(UtiSection,{D:D,u:'utiAB'});
      case 'utic':             return h(UtiSection,{D:D,u:'utic'});
      case 'utiNeo':           return h(UtiNeoSection,{D:D});
      case 'hd':               return h(HdSection,{D:D});
      case 'clinicaMedica':    return h(ClinicaSection,{D:D,which:'clinicaMedica'});
      case 'clinicaCirurgica': return h(ClinicaSection,{D:D,which:'clinicaCirurgica'});
      case 'epm':              return h(ClinicaSection,{D:D,which:'epm'});
      case 'diarreia':         return h(DiarreiaSection,{D:D});
      case 'sura':             return h(SuraSection,{D:D});
      case 'isolamentos':      return h(IsolamentosSection,{D:D});
      default: return null;
    }
  }

  return h('div',{style:{display:'flex',height:'100vh',background:BG}},
    // ── Sidebar ──
    h('div',{style:{width:210,minWidth:210,background:'#1a2744',
      borderRight:'1px solid #0f1e38',display:'flex',flexDirection:'column',overflow:'hidden'}},
      h('div',{style:{padding:'18px 16px 14px',borderBottom:'1px solid #0f1e38'}},
        h('div',{style:{fontFamily:"'IBM Plex Sans',sans-serif",fontSize:13,fontWeight:700,
          color:'#4db6ac',letterSpacing:.2}},'SCIH / CCIH'),
        h('div',{style:{fontSize:9,color:'#7b9bbf',marginTop:2}},
          'Hospital Universitário São Francisco'),
        h('div',{style:{fontSize:8,color:'#5a7a9a',marginTop:1}},'Bragança Paulista · SP'),
        h('div',{style:{fontSize:9,color:'#7b9bbf',marginTop:6}},
          'Autoria:',h('br'),
          'Prof. Dr. Leandro Mendes',h('br'),
          'Médico Infectologista e Epidemiologista'
        ),
        h('div',{style:{display:'inline-flex',alignItems:'center',gap:5,marginTop:10,
          background:'rgba(0,105,92,.15)',padding:'3px 9px',borderRadius:4,
          border:'1px solid rgba(77,182,172,.25)'}},
          h('div',{className:'pulse',style:{width:5,height:5,borderRadius:'50%',background:'#4db6ac'}}),
          h('span',{style:{fontSize:8,color:'#4db6ac',fontWeight:600}},D.periodo)
        )
      ),
      h('div',{style:{flex:1,overflowY:'auto',padding:'6px 0',background:'#1a2744'}},
        groups.map(function(g){
          return h('div',{key:g},
            h('div',{style:{padding:'10px 16px 3px',fontSize:9,color:'#5a7a9a',
              letterSpacing:.5,fontWeight:600,textTransform:'uppercase'}},g),
            NAV.filter(function(n){return n.g===g;}).map(function(item){
              var isA=active===item.id;
              return h('button',{key:item.id,onClick:function(){setActive(item.id);},
                style:{width:'100%',display:'flex',alignItems:'center',gap:8,
                  padding:'8px 16px',border:'none',cursor:'pointer',
                  background:isA?'rgba(255,255,255,.08)':'transparent',
                  borderLeft:isA?'3px solid #4db6ac':'3px solid transparent',
                  color:isA?'#4db6ac':'#9ab0cc',
                  fontFamily:"'IBM Plex Sans',sans-serif",
                  fontSize:11,fontWeight:isA?600:400,textAlign:'left'}},

        h('div',{},
          h('h1',{style:{fontFamily:"'IBM Plex Sans',sans-serif",fontSize:15,
